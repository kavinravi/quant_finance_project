# brands, models, JV partners, products, executives, board members, addresses,
# ZIPs, commission files, founding facts) that were NOT in the original map.
# Merged into additional_terms by agent_pass_worker.py.
#
# match: word  -> whole-word, case-sensitive (common English words / word-prefixes
#                 that would corrupt prose as substrings, e.g. Volt/Spark/Express;
#                 and numeric IDs like ZIPs / commission files).
# default (ci) -> case-insensitive substring (distinctive non-dictionary strings).
#
# CONFIDENTIAL with entities.yaml.

